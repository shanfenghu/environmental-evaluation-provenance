[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "environmental-evaluation-provenance"
version = "0.2.0"
description = "Source-aware retrospective environmental assessment"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.3.5", "pandas==2.2.3", "scikit-learn==1.7.2", "matplotlib==3.10.7"]

[tool.setuptools.packages.find]
where = ["src"]
